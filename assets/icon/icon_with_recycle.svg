<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- Mavi arka plan -->
  <rect width="1024" height="1024" fill="#4285F4"/>
  
  <!-- Beyaz ev/pencereli yapı (mevcut icon) -->
  <g transform="translate(200, 200) scale(0.6)">
    <!-- Ev yapısı -->
    <rect x="100" y="150" width="400" height="250" fill="white" rx="15"/>
    
    <!-- Pencere çerçeveleri -->
    <rect x="120" y="170" width="360" height="210" fill="#4285F4" rx="10"/>
    
    <!-- Pencere slatları (yatay çizgiler) -->
    <rect x="140" y="190" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="210" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="230" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="250" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="270" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="290" width="320" height="8" fill="white" rx="4"/>
    <rect x="140" y="310" width="320" height="8" fill="white" rx="4"/>
    
    <!-- Pencere çerçeve çizgileri -->
    <rect x="300" y="190" width="2" height="130" fill="white"/>
    <rect x="140" y="255" width="320" height="2" fill="white"/>
    
    <!-- Pencere kenarlığı -->
    <rect x="130" y="180" width="340" height="220" fill="none" stroke="white" stroke-width="3" rx="12"/>
  </g>
  
  <!-- Geri dönüşüm oku (beyaz çizginin üzerinde) -->
  <g transform="translate(512, 512) scale(0.8)">
    <!-- Dairesel ok -->
    <path d="M -80 -80 A 80 80 0 0 1 80 -80 L 60 -60 L 80 -40 L 60 -20 L 80 0 L 60 20 L 80 40 L 60 60 L 80 80 A 80 80 0 0 1 -80 80 A 80 80 0 0 1 -80 -80 Z" 
          fill="none" 
          stroke="white" 
          stroke-width="8" 
          stroke-linecap="round"/>
    
    <!-- Ok başı -->
    <path d="M 60 60 L 80 80 L 100 60" 
          fill="none" 
          stroke="white" 
          stroke-width="8" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>
  
  <!-- İç elemanlar (3 yatay çizgi) -->
  <g transform="translate(512, 512) scale(0.4)">
    <rect x="-60" y="-10" width="120" height="4" fill="white" rx="2"/>
    <rect x="-60" y="0" width="120" height="4" fill="white" rx="2"/>
    <rect x="-60" y="10" width="120" height="4" fill="white" rx="2"/>
  </g>
</svg>
