name: garageloop7
description: "GarageLoop - Free sharing community for giving and claiming items locally. Connect with neighbors, reduce waste, and keep items in use."
publish_to: 'none'

version: 1.0.2+4

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  font_awesome_flutter: ^10.7.0
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  google_fonts: ^6.2.1
  cloud_firestore: ^5.5.0
  geolocator: ^12.0.0
  firebase_storage: ^12.3.4
  image_picker: ^1.1.1
  geocoding: ^2.1.1
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5
  crypto: ^3.0.5
  
  # Analytics ve Monitoring
  firebase_analytics: ^11.3.8
  firebase_crashlytics: ^4.3.8
  
  # Push Notifications
  firebase_messaging: ^15.2.10
  http: ^1.2.2
  
  # Connectivity
  connectivity_plus: ^6.0.5
  
  # Image Optimization
  image: ^4.1.7
  path_provider: ^2.1.2
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.1
  path: ^1.9.0
  
  # App Info
  package_info_plus: ^8.0.2
  
  # Maps
  google_maps_flutter: ^2.8.0
  apple_maps_flutter: ^1.4.0
  in_app_purchase: ^3.2.3
  cloud_functions: ^5.6.2
  # Flutter 3.32.6 (Dart 3.8.1) ile uyumlu sürüm
  google_mobile_ads: ^6.0.0
  # iOS 18 / Swift derleme hataları için mevcut SDK ile uyumlu sürüm
  webview_flutter_wkwebview: ^3.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Testing dependencies
  mocktail: ^1.0.3
  
  # App Icon Generator
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  generate: true
  assets:
    - assets/icon.png

# App Icon Configuration
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#4285F4"
  adaptive_icon_foreground: "assets/icon.png"
  image_path: "assets/icon.png"
